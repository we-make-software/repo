<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fff" />
    </marker>
  </defs>

  <style>
    .text { font-family: sans-serif; fill: #fff; text-anchor: middle; }
    .title { font-size: 18px; font-weight: bold; }
    .label { font-size: 14px; }
    .small { font-size: 12px; }
    .box { fill: #1a1a1a; stroke: #fff; stroke-width: 1.5; rx: 6; }
    .flow { fill: none; stroke: #fff; stroke-width: 1.5; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #fff; stroke-width: 1.5; stroke-dasharray: 6,4; marker-end: url(#arrow); }
  </style>

  <rect width="100%" height="100%" fill="#0d0d0d" />

  <text x="400" y="30" class="text title">Server Module: Startup and Shutdown Flow</text>

  <rect x="295" y="70" width="210" height="60" class="box" />
  <text x="400" y="105" class="text label">server_Init</text>

  <rect x="70" y="190" width="140" height="70" class="box" />
  <text x="140" y="225" class="text label">Debug</text>
  <text x="140" y="248" class="text small">trace layer</text>

  <rect x="250" y="190" width="140" height="70" class="box" />
  <text x="320" y="225" class="text label">Common</text>
  <text x="320" y="248" class="text small">shared base</text>

  <rect x="430" y="190" width="140" height="70" class="box" />
  <text x="500" y="225" class="text label">Hardware</text>
  <text x="500" y="248" class="text small">device control</text>

  <rect x="610" y="190" width="140" height="70" class="box" />
  <text x="680" y="225" class="text label">OSI</text>
  <text x="680" y="248" class="text small">protocol stack</text>

  <rect x="300" y="330" width="200" height="70" class="box" />
  <text x="400" y="365" class="text label">IsRunning == true</text>
  <text x="400" y="388" class="text small">runtime gate</text>

  <rect x="295" y="460" width="210" height="60" class="box" />
  <text x="400" y="495" class="text label">Quit / server_Exit</text>

  <path d="M 400 130 V 170" class="flow" />
  <text x="440" y="155" class="text small">layered init</text>

  <path d="M 140 190 V 155 H 680 V 190" class="dash" />
  <text x="400" y="145" class="text small">Debug -> Common -> Hardware -> OSI</text>

  <path d="M 400 260 V 330" class="flow" />
  <text x="455" y="300" class="text small">system enters running state</text>

  <path d="M 400 400 V 460" class="flow" />
  <text x="455" y="435" class="text small">shutdown or reboot</text>

  <path d="M 680 260 V 290 H 140 V 260" class="dash" />
  <text x="400" y="310" class="text small">reverse unwind on exit</text>
</svg>
