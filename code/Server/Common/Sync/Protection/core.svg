<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs >
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff" stroke="#fff" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0d0d0d" stroke="#fff" />
  
  
  <g font-family="monospace" font-size="14" text-anchor="middle" fill="#fff">
    <!-- Title -->
    <rect x="50" y="20" width="700" height="40" fill="none" stroke="#fff" stroke-width="1" />
    <text x="400" y="45" font-weight="bold" fill="#fff">Common:Sync:Protection</text>
    <line x1="400" y1="60" x2="400" y2="75" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)" />
    
    <!-- API Group -->
    <rect x="50" y="75" width="700" height="310" fill="none" stroke="#fff" stroke-width="1" />
    <text x="400" y="100" fill="#fff">SyncProtectionSetup(scsp,limition,utc,before,after,event,immediate)</text>
    <text x="400" y="130" fill="#fff">SyncProtectionGet(scsp,utc)</text>
    <text x="400" y="160" fill="#fff">SyncProtectionLock(scsp)/SyncProtectionUnlock(scsp)</text>
    <text x="400" y="190" fill="#fff">SyncProtectionDelete(scsp,utc)/SyncProtectionBlock(scsp,utc)</text>
    <text x="400" y="220" fill="#fff">SyncProtectionIncreaseLimition(scsp,limition)</text>
    <text x="400" y="250" fill="#fff">SyncProtectionDecreaseLimition(scsp,limition)</text>
    <text x="400" y="280" fill="#fff">SyncProtectionGetLimition(scsp)</text>
    <text x="400" y="310" fill="#fff">SyncProtectionEvent(scsp,event)</text>
    <text x="400" y="340" fill="#fff">SyncProtectionImmediate(scsp,immediate)</text>
    
    <line x1="400" y1="385" x2="400" y2="400" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)" />
    
    <!-- State Group -->
    <rect x="50" y="400" width="700" height="80" fill="none" stroke="#fff" stroke-width="1" />
    <text x="200" y="430" fill="#fff">Limitation: Count-based</text>
    <text x="600" y="430" fill="#fff">UTC: Time-based</text>
    <text x="400" y="460" fill="#fff">Delayed Work: Automatic Expiration</text>
  </g>
</svg>
