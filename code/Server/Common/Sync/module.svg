<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fff" />
    </marker>
  </defs>

  <style>
    .text { font-family: sans-serif; fill: #fff; text-anchor: middle; }
    .title { font-size: 18px; font-weight: bold; }
    .label { font-size: 14px; }
    .small { font-size: 12px; }
    .box { fill: #1a1a1a; stroke: #fff; stroke-width: 1.5; rx: 6; }
    .flow { fill: none; stroke: #fff; stroke-width: 1.5; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #fff; stroke-width: 1.5; stroke-dasharray: 6,4; marker-end: url(#arrow); }
  </style>

  <rect width="100%" height="100%" fill="#0d0d0d" />

  <text x="400" y="30" class="text title">Sync Module: Ownership and Finality Flow</text>

  <rect x="40" y="110" width="170" height="60" class="box" />
  <text x="125" y="145" class="text label">External Caller</text>

  <rect x="285" y="95" width="230" height="150" class="box" />
  <text x="400" y="125" class="text label">Sync Object</text>
  <text x="400" y="155" class="text small">Status: Active</text>
  <text x="400" y="180" class="text small">Reference Count</text>
  <text x="400" y="200" class="text small">Mutex Guarded</text>
  <text x="400" y="220" class="text small">before / after hooks</text>

  <rect x="50" y="360" width="170" height="70" class="box" />
  <text x="135" y="395" class="text label">ProcessDeleting</text>
  <text x="135" y="420" class="text small">contested deletion window</text>

  <rect x="580" y="360" width="175" height="80" class="box" />
  <text x="667" y="395" class="text label">Delete State</text>
  <text x="667" y="420" class="text small">before -> after hooks</text>

  <path d="M 210 140 C 255 140, 265 140, 285 140" class="flow" />
  <text x="248" y="125" class="text small">Get / Lock</text>

  <path d="M 160 170 C 245 215, 305 245, 350 250" class="dash" />
  <text x="255" y="220" class="text small">Delete request</text>

  <path d="M 340 245 C 290 300, 220 340, 180 360" class="flow" />
  <text x="255" y="320" class="text small">ref reaches zero</text>

  <path d="M 220 390 C 310 335, 330 300, 370 245" class="dash" />
  <text x="285" y="350" class="text small">new Get revives Active</text>

  <path d="M 220 395 C 360 455, 500 465, 580 420" class="flow" />
  <text x="405" y="485" class="text small">no claimant returns</text>

  <path d="M 515 170 H 600" class="dash" />
  <text x="560" y="150" class="text small">final authority closes</text>
</svg>
