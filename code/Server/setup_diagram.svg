<svg width="800" height="780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff" />
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="780" fill="#0d0d0d" stroke="#fff" stroke-width="2"/>
  <text x="400" y="50" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">Server.setup:MacroDefinitions&amp;Status</text>
  
  <g font-family="monospace" font-size="14" fill="#fff">
    <!-- Naming & Lifecycle -->
    <rect x="50" y="80" width="700" height="110" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="70" y="100">NAME(symbol,args...):HierarchicalNamingLogic</text>
    <text x="70" y="140">InitLibrary/QuitLibrary:ModuleImplementationBlocks</text>
    <text x="70" y="170">LibraryInit/LibraryQuit:AutomaticModuleLifecycle</text>

    <line x1="400" y1="190" x2="400" y2="200" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>

    <!-- Structs -->
    <rect x="50" y="200" width="700" height="60" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="70" y="210">StructDisk(aligned1024),StructAlign(packed)</text>
    <text x="70" y="240">StructMemory,StructHelp,EnumHelp,EnumValueHelp</text>

    <line x1="400" y1="260" x2="400" y2="270" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>

    <!-- Functions -->
    <rect x="50" y="270" width="700" height="180" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="70" y="280">Fn(type,args...):FunctionDeclaration</text>
    <text x="70" y="310">Call(args...):FunctionCall</text>
    <text x="70" y="350">FnNew/New:AllocationLifecycle</text>
    <text x="70" y="380">FnTX/TX:TransmissionPath</text>
    <text x="70" y="410">FnRX/RX:ReceptionPath</text>
    <text x="70" y="440">FnShutdown/Shutdown:TerminationPath</text>

    <line x1="400" y1="450" x2="400" y2="470" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>

    <!-- Memory -->
    <rect x="50" y="470" width="700" height="80" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="70" y="480">MemoryPrepare(size):InitializeMemoryPool</text>
    <text x="70" y="510">MemoryGet(name,args...):Allocation&amp;NullCheck</text>
    <text x="70" y="540">MemoryDelete(name):Deallocation</text>

    <line x1="400" y1="550" x2="400" y2="570" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>

    <!-- Debug -->
    <rect x="50" y="570" width="700" height="140" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="70" y="580">DebugOutput(args...):DefineOutputHandle</text>
    <text x="70" y="610">DebugMessages(name,args...):DefineMessageHandle</text>
    <text x="70" y="640">DebugOutputPrepare(args...):OpenLogFile</text>
    <text x="70" y="670">DebugMessagesPrepare(name,args...):CreateMessage</text>
    <text x="70" y="700">DebugValuePrepare(name,value,args...):LogValue</text>

    <line x1="400" y1="710" x2="400" y2="720" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>

    <!-- Status -->
    <rect x="50" y="720" width="700" height="30" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="70" y="730">IsRunning(void):CheckModuleExecutionStatus</text>
  </g>
</svg>
