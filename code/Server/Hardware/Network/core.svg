<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff"  stroke="#fff"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0d0d0d"/>
  
  <g font-family="monospace" font-size="14" text-anchor="middle" fill="#fff">
    <!-- Group 0 -->
    <rect x="50" y="20" width="700" height="60" fill="transparent" stroke="#fff" stroke-width="1"/>
    <text x="400" y="45" font-weight="bold" fill="#fff">Hardware:Network:DriverLayer</text>
    <line x1="400" y1="60" x2="400" y2="95" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)" />
    <!-- Group 1 -->
    <rect x="50" y="95" width="700" height="60" fill="transparent" stroke="#fff" stroke-width="1"/>
    <text x="400" y="120" fill="#fff">RawPacketI/O&amp;HardwareControl</text>
    <line x1="400" y1="135" x2="400" y2="175" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)" />
    <!-- Group 2 -->
    <rect x="50" y="175" width="700" height="60" fill="transparent" stroke="#fff" stroke-width="1"/>
    <text x="400" y="200" fill="#fff">InitLibrary(Server,Hardware,Network)</text>
    <text x="400" y="220" font-family="monospace" font-size="14" fill="#fff" text-anchor="middle" fill="#fff">QuitLibrary(Server,Hardware,Network)</text>
  </g>
</svg>