<svg width="800" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs >
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff" stroke="#fff" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0d0d0d" stroke="#fff" />
  
  
  
  <g font-family="monospace" font-size="14" text-anchor="middle" fill="#fff">
    <!-- Group 0 -->
    <rect x="50" y="20" width="700" height="60" fill="none" stroke="#fff" stroke-width="1" />
    <text x="400" y="45" font-weight="bold" fill="#fff">Hardware:AbstractionLayer</text>
    <line x1="400" y1="60" x2="400" y2="75" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)" />
    <!-- Group 1 -->
    <rect x="50" y="75" width="700" height="120" fill="none" stroke="#fff" stroke-width="1" />
    <text x="400" y="100" fill="#fff">Memory:Allocation&amp;PoolManagement</text>
