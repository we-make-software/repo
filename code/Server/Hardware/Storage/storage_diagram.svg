<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff" />
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#0d0d0d" stroke="#fff" stroke-width="2"/>
  <g font-family="monospace" font-size="14" text-anchor="middle" fill="#fff">
    <!-- Group 0 -->
    <rect x="50" y="20" width="700" height="40" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="45" font-weight="bold">Hardware:Storage:SubSystem</text>
    <line x1="400" y1="60" x2="400" y2="75" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>
    <!-- Group 1 -->
    <rect x="50" y="75" width="700" height="100" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="100">Block:BlockDeviceI/O,Config:Parameters</text>
    <text x="400" y="130">Local:FileSystemInterface,Upgrade:Firmware</text>
    <text x="400" y="160">Delete:ResourceCleanup</text>
    <line x1="400" y1="175" x2="400" y2="215" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>
    <!-- Group 2 -->
    <rect x="50" y="215" width="700" height="40" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="240">LibraryInit(Server,Hardware,Storage,...)</text>
    <line x1="400" y1="255" x2="400" y2="275" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>
    <!-- Group 3 -->
    <rect x="50" y="275" width="700" height="40" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="300">InitLibrary(Server,Hardware,Storage)</text>
  </g>
</svg>