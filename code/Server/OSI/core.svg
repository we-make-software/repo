<svg width="800" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff" />
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#0d0d0d" stroke="#fff" stroke-width="2"/>
  <g font-family="monospace" font-size="14" text-anchor="middle" fill="#fff">
    <!-- Group 0 -->
    <rect x="50" y="20" width="700" height="60" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="45" font-weight="bold">OSI:ProtocolStack</text>
    <line x1="400" y1="60" x2="400" y2="75" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>
    <!-- Group 1 -->
    <rect x="50" y="75" width="700" height="120" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="100">Layer2:EUI48,IEEE8023,RFC7042,RFC2464,RFC826</text>
    <text x="400" y="130">Layer3:RFC791(IPv4),RFC8200(IPv6)</text>
    <text x="400" y="160">Control:RFC4443(ICMPv6)</text>
    <line x1="400" y1="175" x2="400" y2="215" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>
    <!-- Group 2 -->
    <rect x="50" y="215" width="700" height="60" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="240">LibraryInit(Server,OSI,...)</text>
    <line x1="400" y1="255" x2="400" y2="275" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)"/>
    <!-- Group 3 -->
    <rect x="50" y="275" width="700" height="60" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="300">InitLibrary(Server,OSI)</text>
    <text x="400" y="320" font-family="monospace" font-size="14" fill="#fff" text-anchor="middle">QuitLibrary(Server,OSI)</text>
  </g>
</svg>