<svg xmlns="http://www.w3.org/2000/svg" width="400" height="80">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff" />
    </marker>
  </defs>
<rect width="100%" height="100%" fill="#0d0d0d" stroke="#fff" stroke-width="2"/>
  <g font-family="monospace" font-size="14" fill="#fff" text-anchor="middle">
    <!-- Group 0 -->
    <rect x="50" y="0" width="300" height="80" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="50%" y="25" font-family="monospace" font-size="14" fill="#fff" text-anchor="middle">IEEE8023:EthernetMAC</text>
    <text x="50%" y="45" font-family="monospace" font-size="14" fill="#fff" text-anchor="middle">InitLibrary(Server,OSI,IEEE8023)</text>
    <text x="50%" y="65" font-family="monospace" font-size="14" fill="#fff" text-anchor="middle">QuitLibrary(Server,OSI,IEEE8023)</text>
  </g>
