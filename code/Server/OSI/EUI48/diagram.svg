<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Box -->
  <rect x="10" y="40" width="540" height="60" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  
  <!-- Byte Dividers -->
  <line x1="100" y1="40" x2="100" y2="100" stroke="#333" stroke-width="1"/>
  <line x1="190" y1="40" x2="190" y2="100" stroke="#333" stroke-width="1"/>
  <line x1="280" y1="40" x2="280" y2="100" stroke="#333" stroke-width="1"/>
  <line x1="370" y1="40" x2="370" y2="100" stroke="#333" stroke-width="1"/>
  <line x1="460" y1="40" x2="460" y2="100" stroke="#333" stroke-width="1"/>

  <!-- Byte Labels -->
  <text x="55" y="75" font-family="monospace" font-size="14" text-anchor="middle">Byte 0</text>
  <text x="145" y="75" font-family="monospace" font-size="14" text-anchor="middle">Byte 1</text>
  <text x="235" y="75" font-family="monospace" font-size="14" text-anchor="middle">Byte 2</text>
  <text x="325" y="75" font-family="monospace" font-size="14" text-anchor="middle">Byte 3</text>
  <text x="415" y="75" font-family="monospace" font-size="14" text-anchor="middle">Byte 4</text>
  <text x="505" y="75" font-family="monospace" font-size="14" text-anchor="middle">Byte 5</text>

  <!-- Bit Breakout for Byte 0 -->
  <path d="M 10 100 L 10 160 L 100 160 L 100 100" fill="none" stroke="#666" stroke-dasharray="4"/>
  <rect x="10" y="160" width="90" height="30" fill="#e1f5fe" stroke="#01579b" stroke-width="1"/>
  <line x1="40" y1="160" x2="40" y2="190" stroke="#01579b" stroke-width="1"/>
  <line x1="70" y1="160" x2="70" y2="190" stroke="#01579b" stroke-width="1"/>

  <text x="25" y="180" font-family="monospace" font-size="12" text-anchor="middle" fill="#01579b">IG</text>
  <text x="55" y="180" font-family="monospace" font-size="12" text-anchor="middle" fill="#01579b">UL</text>
  <text x="85" y="180" font-family="monospace" font-size="10" text-anchor="middle" fill="#01579b">RES</text>

  <!-- Titles -->
  <text x="10" y="25" font-family="sans-serif" font-size="16" font-weight="bold">EUI-48 MAC Address Structure</text>
</svg>
