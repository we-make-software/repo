<svg width="800" height="620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff" stroke="#fff"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0d0d0d"/>
  
  <g font-family="monospace" font-size="14" text-anchor="middle" fill="#fff">
    <!-- Group 0 -->
    <rect x="50" y="20" width="700" height="145" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="45" font-weight="bold" fill="#fff">Debug:Structs</text>
    <text x="400" y="80" fill="#fff">StructMemory(Server,Debug,Output)</text>
    <text x="400" y="105" fill="#fff">StructMemory(Server,Debug,Output,Message)</text>
    <text x="400" y="130" fill="#fff">StructMemory(Server,Debug,Output,Message,Value)</text>
    <line x1="400" y1="145" x2="400" y2="160" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)" />
    <!-- Group 1 -->
    <rect x="50" y="160" width="700" height="195" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="185" font-weight="bold" fill="#fff">Debug:Macros</text>
    <text x="400" y="220" fill="#fff">DebugOutput(args...)</text>
    <text x="400" y="245" fill="#fff">DebugMessages(name,args...)</text>
    <text x="400" y="270" fill="#fff">DebugOutputPrepare(args...)</text>
    <text x="400" y="295" fill="#fff">DebugMessagesPrepare(name,args...)</text>
    <text x="400" y="320" fill="#fff">DebugValuePrepare(name,value,args...)</text>
    <line x1="400" y1="335" x2="400" y2="360" stroke="#fff" stroke-width="1" marker-end="url(#arrowhead)" />
    <!-- Group 2 -->
    <rect x="50" y="360" width="700" height="195" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="400" y="385" font-weight="bold" fill="#fff">Debug:Functions</text>
    <text x="400" y="420" fill="#fff">Fn(void,Server,Debug,Output,Write)(sdo,data,len)</text>
    <text x="400" y="445" fill="#fff">Fn(void,Server,Debug,Output,Message,Write)(sdom)</text>
    <text x="400" y="470" fill="#fff">Fn(StructMemory(Server,Debug,Output)*,Server,Debug,Output,New)(path)</text>
    <text x="400" y="495" fill="#fff">Fn(void,Server,Debug,Output,Message,Value,New)(sdom,value)</text>
    <text x="400" y="520" fill="#fff">InitLibrary(Server,Debug)</text>
    <text x="400" y="540" font-family="monospace" font-size="14" text-anchor="middle" fill="#fff">QuitLibrary(Server,Debug)</text>
  </g>
